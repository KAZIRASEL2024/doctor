version: '3.8'

services:
  # 1. PostgreSQL Relational Database
  postgres:
    image: postgres:16-alpine
    container_name: cattledoc_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: cattle_doc_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cattle_doc_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. FastAPI Multimedia & Triage Microservice (Python)
  fastapi-service:
    build:
      context: ./service-fastapi
      dockerfile: Dockerfile
    container_name: cattledoc_fastapi
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./service-fastapi:/app
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # 3. Node.js Express Primary Backend & Web Dashboard
  backend-node:
    build:
      context: ./backend-node
      dockerfile: Dockerfile
    container_name: cattledoc_node
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/cattle_doc_db
      - FASTAPI_URL=http://fastapi-service:8000
      - JWT_SECRET=cattle-doctor-production-secret-2024
    volumes:
      - ./backend-node:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      fastapi-service:
        condition: service_started

volumes:
  pgdata:
